services:
  hermes:
    image: docker.io/nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    user: "0:0" # 1. Forces container to start as root so the entrypoint can fix permissions
    ports:
      - "8642:8642" # gateway API
      - "9119:9119" # dashboard (only reached when HERMES_DASHBOARD=1)
    volumes:
      - ./hermes:/opt/data
      - ./projects:/opt/projects
    environment:
      - HERMES_DASHBOARD=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HERMES_UID=${HERMES_UID:-1000} # 2. Automatically aligns internal user UID with yours
      - HERMES_GID=${HERMES_GID:-1000} # 3. Automatically aligns internal user GID with yours
      # Uncomment to forward specific env vars instead of using .env file:
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
